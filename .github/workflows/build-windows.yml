name: build-windows

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Tests (Windows)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests
      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean SarrafRecon.spec
      - name: Smoke-run EXE (starts and creates its database)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $p = Start-Process -FilePath "dist\SarrafRecon\SarrafRecon.exe" -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "EXE exited early with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          if (-not (Test-Path "dist\SarrafRecon\data\sarraf_recon.db")) { throw "database not created" }
          Remove-Item -Recurse -Force "dist\SarrafRecon\data"
      - name: Add docs and demo files
        shell: pwsh
        run: |
          Copy-Item README.md dist\SarrafRecon\
          Copy-Item -Recurse docs dist\SarrafRecon\docs
          Copy-Item -Recurse demo dist\SarrafRecon\demo
      - uses: actions/upload-artifact@v4
        with:
          name: SarrafRecon-Windows
          path: dist/SarrafRecon
          retention-days: 30
